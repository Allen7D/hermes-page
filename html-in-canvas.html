<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML-in-Canvas + Three.js 实验</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === 顶栏 === */
    #header {
      padding: 10px 20px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; color: #fff; white-space: nowrap; }
    #feature-detect { display: flex; gap: 8px; font-size: 11px; flex-wrap: wrap; }
    .feat-item { padding: 2px 8px; border-radius: 4px; background: #2a2a4a; }
    .feat-item.yes { background: #1a4a2a; color: #6f6; }
    .feat-item.no  { background: #4a1a1a; color: #f66; }

    /* === 场景容器 === */
    #scene-container { flex: 1; position: relative; overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; }

    /* === Canvas 子元素样式（HTML-in-Canvas 模式使用） === */
    /* 放大 2 倍渲染，再 scale 缩回原尺寸，让光栅化产出 2x 纹理像素 */
    .canvas-label {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      border-radius: 12px;
      font-size: 28px;
      font-family: system-ui, sans-serif;
      white-space: nowrap;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transform: scale(0.5);
      transform-origin: top left;
    }

    /* === Canvas 子元素：真实控件样式（2x 分辨率） === */
    .canvas-ctrl {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      border-radius: 12px;
      font-size: 26px;
      font-family: system-ui, sans-serif;
      white-space: nowrap;
      border: 2px solid rgba(255,255,255,0.15);
      transform: scale(0.5);
      transform-origin: top left;
    }
    .canvas-btn {
      cursor: pointer;
      background: #4a2a6a;
      border: 2px solid #7a4aaa;
      padding: 12px 32px;
      text-align: center;
      font-size: 26px;
    }
    .canvas-btn:hover { background: #6a3a8a; }
    .canvas-btn:active { background: #8a4aaa; }
    .canvas-slider input[type="range"] {
      width: 160px;
      height: 16px;
      accent-color: #7a4aaa;
      cursor: pointer;
    }
    .canvas-select select {
      background: #2a2a4a;
      color: #fff;
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 24px;
      cursor: pointer;
    }
    .canvas-select select:focus { outline: 2px solid #7a4aaa; }

    /* === DOM-overlay 标签样式 === */
    #dom-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .overlay-label {
      position: absolute;
      left: 0; top: 0;
      padding: 5px 12px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* === DOM-overlay 交互控件样式 === */
    .overlay-ctrl {
      position: absolute;
      left: 0; top: 0;
      padding: 5px 10px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: auto;
    }
    .overlay-ctrl button {
      background: #4a2a6a;
      border: 1px solid #7a4aaa;
      padding: 4px 14px;
      cursor: pointer;
    }
    .overlay-ctrl button:hover { background: #6a3a8a; }
    .overlay-ctrl input[type="range"] {
      width: 70px;
      accent-color: #7a4aaa;
      cursor: pointer;
      vertical-align: middle;
    }
    .overlay-ctrl select {
      background: #2a2a4a;
      color: #fff;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .overlay-ctrl label { cursor: default; }

    /* === 底栏 === */
    #footer {
      padding: 8px 20px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #mode-info { font-size: 12px; color: #aaa; }
    #mode-info strong { color: #fff; }
    button {
      padding: 5px 14px;
      border: 1px solid #4a4a6a;
      border-radius: 6px;
      background: #2a2a4a;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #3a3a5a; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.active { background: #4a2a6a; border-color: #7a4aaa; }
    #hint { font-size: 11px; color: #666; margin-left: auto; }

    /* === 2D Canvas 演示区 === */
    #demo-2d {
      position: absolute;
      bottom: 60px; right: 16px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px;
      z-index: 10;
    }
    #demo-2d h3 { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    #demo-2d canvas { border-radius: 4px; display: block; }
    #demo-2d .canvas-label { font-size: 12px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div id="header">
    <h1>HTML-in-Canvas + Three.js</h1>
    <div id="feature-detect"></div>
  </div>

  <div id="scene-container">
    <!-- Three.js 画布，layoutsubtree 属性启用 HTML-in-Canvas -->
    <canvas id="c" layoutsubtree>
      <!-- HTML 子元素：HTML-in-Canvas 模式下作为 HTMLTexture 的源 -->
      <div id="cl-cube" class="canvas-label">立方体 Cube</div>
      <div id="cl-sphere" class="canvas-label">球体 Sphere</div>
      <div id="cl-torus" class="canvas-label">圆环 Torus</div>
      <button id="cl-btn" class="canvas-ctrl canvas-btn">切换颜色</button>
      <label id="cl-slider" class="canvas-ctrl canvas-slider">
        <span>亮度</span>
        <input id="cl-range" type="range" min="0" max="100" value="60" />
        <span id="cl-range-val">60%</span>
      </label>
      <label id="cl-select" class="canvas-ctrl canvas-select">
        <span>模式</span>
        <select id="cl-sel">
          <option value="standard">标准</option>
          <option value="wireframe">线框</option>
          <option value="flat">平面</option>
        </select>
      </label>
    </canvas>

    <!-- DOM-overlay 标签容器 -->
    <div id="dom-overlay">
      <div class="overlay-label" id="ol-cube">立方体 Cube</div>
      <div class="overlay-label" id="ol-sphere">球体 Sphere</div>
      <div class="overlay-label" id="ol-torus">圆环 Torus</div>
      <div class="overlay-ctrl" id="ol-btn-wrap">
        <button id="ol-btn">切换颜色</button>
      </div>
      <div class="overlay-ctrl" id="ol-slider-wrap">
        <label>亮度 <input id="ol-range" type="range" min="0" max="100" value="60" /> <span id="ol-range-val">60%</span></label>
      </div>
      <div class="overlay-ctrl" id="ol-select-wrap">
        <label>模式 <select id="ol-sel">
          <option value="standard">标准</option>
          <option value="wireframe">线框</option>
          <option value="flat">平面</option>
        </select></label>
      </div>
    </div>

    <!-- 2D Canvas drawElementImage 演示 -->
    <div id="demo-2d" style="display:none">
      <h3>2D Canvas: drawElementImage()</h3>
      <canvas id="c2d" width="260" height="100" layoutsubtree>
        <div id="cl2d" class="canvas-label">Hello HTML-in-Canvas!</div>
      </canvas>
    </div>
  </div>

  <div id="footer">
    <button id="btn-overlay" class="active">DOM-overlay</button>
    <button id="btn-htmlincanvas" disabled>HTML-in-Canvas</button>
    <span id="mode-info">当前: <strong>DOM-overlay</strong>（标签始终可见，无法被遮挡）</span>
    <span id="hint">旋转场景观察墙壁遮挡 | 启用: chrome://flags/#canvas-draw-element</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========================================
    // 1. Feature Detection（特性检测）
    // ========================================
    const testCanvas = document.createElement('canvas');
    const testCtx = testCanvas.getContext('2d');
    const features = {
      'drawElementImage': typeof testCtx.drawElementImage === 'function',
      'requestPaint': typeof testCanvas.requestPaint === 'function',
      'HTMLTexture': typeof THREE.HTMLTexture === 'function',
    };
    const apiSupported = features.drawElementImage && features.requestPaint && features.HTMLTexture;

    // 显示检测结果
    const featContainer = document.getElementById('feature-detect');
    for (const [name, supported] of Object.entries(features)) {
      const span = document.createElement('span');
      span.className = 'feat-item ' + (supported ? 'yes' : 'no');
      span.textContent = name + ': ' + (supported ? '\u2713' : '\u2717');
      featContainer.appendChild(span);
    }

    // ========================================
    // 2. Three.js Scene（场景搭建）
    // ========================================
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x0f0f1a);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0f0f1a, 10, 25);

    const camera = new THREE.PerspectiveCamera(55, 2, 0.1, 100);
    camera.position.set(0, 4, 8);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.update();

    // --- 灯光 ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    // --- 地面 + 网格 ---
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 20, 0x2a2a4a, 0x1a1a3a);
    grid.position.y = 0.01;
    scene.add(grid);

    // --- 3D 物体 ---
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x44aa88, roughness: 0.4 })
    );
    cube.position.set(-2.5, 0.6, 0);
    cube.castShadow = true;
    scene.add(cube);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x8844aa, roughness: 0.3 })
    );
    sphere.position.set(0, 0.7, 0);
    sphere.castShadow = true;
    scene.add(sphere);

    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(0.55, 0.22, 16, 48),
      new THREE.MeshStandardMaterial({ color: 0xaa8844, roughness: 0.35 })
    );
    torus.position.set(2.5, 0.7, 0);
    torus.castShadow = true;
    scene.add(torus);

    // --- 按钮：圆柱体 ---
    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 1.0, 32),
      new THREE.MeshStandardMaterial({ color: 0x6a3a8a, roughness: 0.35 })
    );
    cylinder.position.set(-1.2, 0.5, -2);
    cylinder.castShadow = true;
    scene.add(cylinder);

    // --- 滑动条：圆锥体 ---
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 1.2, 32),
      new THREE.MeshStandardMaterial({ color: 0x3a8a6a, roughness: 0.35 })
    );
    cone.position.set(1.2, 0.6, -2);
    cone.castShadow = true;
    scene.add(cone);

    // --- 下拉框：十二面体 ---
    const dodeca = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.55),
      new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.35 })
    );
    dodeca.position.set(0, 0.6, -2);
    dodeca.castShadow = true;
    scene.add(dodeca);

    // --- 遮挡墙（用于演示标签遮挡效果） ---
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 4),
      new THREE.MeshStandardMaterial({
        color: 0x6666aa,
        transparent: true,
        opacity: 0.55,
        side: THREE.DoubleSide,
        roughness: 0.5,
        depthWrite: true,
      })
    );
    wall.position.set(0, 2, 2);
    wall.renderOrder = 1;
    scene.add(wall);

    // 墙壁边框
    const wallEdges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(7, 4)),
      new THREE.LineBasicMaterial({ color: 0x8888cc })
    );
    wall.add(wallEdges);

    // --- 物体数据 ---
    const objects = [
      { mesh: cube,     name: '立方体', overlayId: 'ol-cube',       canvasLabelId: 'cl-cube',   yOffset: 1.3 },
      { mesh: sphere,   name: '球体',   overlayId: 'ol-sphere',     canvasLabelId: 'cl-sphere', yOffset: 1.4 },
      { mesh: torus,    name: '圆环',   overlayId: 'ol-torus',      canvasLabelId: 'cl-torus',  yOffset: 1.3 },
      { mesh: cylinder, name: '按钮',   overlayId: 'ol-btn-wrap',   canvasLabelId: 'cl-btn',    yOffset: 1.1 },
      { mesh: cone,     name: '滑动条', overlayId: 'ol-slider-wrap', canvasLabelId: 'cl-slider', yOffset: 1.3 },
      { mesh: dodeca,   name: '下拉框', overlayId: 'ol-select-wrap', canvasLabelId: 'cl-select', yOffset: 1.2 },
    ];

    // ========================================
    // 3. DOM-Overlay Labels（DOM 覆盖层标签）
    // ========================================
    const overlayLabels = objects.map(obj => ({
      ...obj,
      elem: document.getElementById(obj.overlayId),
    }));

    /**
     * 更新 DOM-overlay 标签位置（每帧投影 3D 坐标到 2D 屏幕）
     * @param {THREE.Camera} cam - 当前相机
     */
    function updateOverlayLabels(cam) {
      const tempV = new THREE.Vector3();
      const rect = canvas.getBoundingClientRect();

      overlayLabels.forEach(({ mesh, elem, yOffset }) => {
        mesh.getWorldPosition(tempV);
        tempV.y += yOffset;
        tempV.project(cam);

        if (tempV.z > 1) { elem.style.display = 'none'; return; }

        const x = (tempV.x * 0.5 + 0.5) * rect.width;
        const y = (-tempV.y * 0.5 + 0.5) * rect.height;
        elem.style.display = '';
        elem.style.transform = 'translate(-50%,-100%) translate(' + x + 'px,' + y + 'px)';
      });
    }

    // ========================================
    // 4. HTML-in-Canvas Labels（HTML 渲染进 Canvas）
    // ========================================
    let htmlInCanvasLabels = [];
    let interactionManager = null;

    if (apiSupported) {
      try {
        const { HTMLTexture } = THREE;

        // 尝试加载 InteractionManager
        let InteractionManager = null;
        try {
          const mod = await import('three/addons/interaction/InteractionManager.js');
          InteractionManager = mod.InteractionManager;
        } catch (e) {
          console.warn('InteractionManager 不可用:', e.message);
        }

        if (InteractionManager) {
          interactionManager = new InteractionManager();
          interactionManager.connect(renderer, camera);
        }

        htmlInCanvasLabels = objects.map(obj => {
          const htmlElem = document.getElementById(obj.canvasLabelId);

          // 创建 HTMLTexture（将真实 DOM 元素作为 WebGL 纹理）
          const texture = new HTMLTexture(htmlElem);
          // 提升清晰度：各向异性过滤 + 保持线性过滤
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.minFilter = THREE.LinearMipmapLinearFilter;
          texture.magFilter = THREE.LinearFilter;

          // 按 DOM 元素实际宽高比创建平面，避免拉伸变形
          const rect = htmlElem.getBoundingClientRect();
          const aspect = rect.width / rect.height || 3.3;
          const planeH = 0.3;
          const planeW = planeH * aspect;

          // 创建 billboard 平面（始终面向相机的标签面片）
          const planeGeo = new THREE.PlaneGeometry(planeW, planeH);
          const planeMat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthTest: true,
            depthWrite: false,
          });
          const plane = new THREE.Mesh(planeGeo, planeMat);
          plane.visible = false;
          plane.renderOrder = 2; // 在墙壁之后渲染，可被墙壁遮挡
          scene.add(plane);

          if (interactionManager) {
            interactionManager.add(plane);
          }

          return { mesh: obj.mesh, plane, texture, yOffset: obj.yOffset, htmlElem };
        });

        // 修复：InteractionManager 不合成 click 事件，
        // 用 raycaster 直接检测点击，手动转发到真实 DOM 元素
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clickPlanes = htmlInCanvasLabels.map(l => l.plane);

        canvas.addEventListener('click', (e) => {
          if (currentMode !== 'html-in-canvas') return;
          const rect = canvas.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(clickPlanes);
          if (hits.length > 0) {
            const hitPlane = hits[0].object;
            const label = htmlInCanvasLabels.find(l => l.plane === hitPlane);
            if (label && label.htmlElem) {
              label.htmlElem.click();
            }
          }
        });

        // 启用 HTML-in-Canvas 按钮
        document.getElementById('btn-htmlincanvas').disabled = false;

      } catch (e) {
        console.warn('HTML-in-Canvas 初始化失败:', e);
      }
    }

    /**
     * 更新 HTML-in-Canvas 标签位置（billboard + InteractionManager）
     * @param {THREE.Camera} cam - 当前相机
     */
    function updateHtmlInCanvasLabels(cam) {
      const tempV = new THREE.Vector3();

      htmlInCanvasLabels.forEach(({ mesh, plane, yOffset }) => {
        mesh.getWorldPosition(tempV);
        tempV.y += yOffset;
        plane.position.copy(tempV);
        // Billboard: 始终面向相机
        plane.quaternion.copy(cam.quaternion);
      });

      if (interactionManager) {
        interactionManager.update();
      }
    }

    // ========================================
    // 5. 2D Canvas drawElementImage 演示
    // ========================================
    if (features.drawElementImage && features.requestPaint) {
      const demo2d = document.getElementById('demo-2d');
      demo2d.style.display = '';

      const c2d = document.getElementById('c2d');
      const ctx2d = c2d.getContext('2d');
      const cl2d = document.getElementById('cl2d');

      /** 2D Canvas 绘制回调 */
      c2d.onpaint = () => {
        ctx2d.reset();
        // 背景
        ctx2d.fillStyle = '#0f0f1a';
        ctx2d.fillRect(0, 0, c2d.width, c2d.height);

        // 旋转变换后绘制 HTML 元素
        ctx2d.save();
        ctx2d.translate(130, 50);
        ctx2d.rotate(0.1 * Math.sin(Date.now() * 0.002));
        const transform = ctx2d.drawElementImage(cl2d, -60, -15);
        // 同步 DOM 位置（命中测试、无障碍关键步骤）
        cl2d.style.transform = transform.toString();
        ctx2d.restore();
      };

      // 定期触发重绘
      setInterval(() => { c2d.requestPaint(); }, 50);
      c2d.requestPaint();
    }

    // ========================================
    // 6. Mode Toggle（模式切换）
    // ========================================
    let currentMode = 'dom-overlay';
    const btnOverlay = document.getElementById('btn-overlay');
    const btnHtmlInCanvas = document.getElementById('btn-htmlincanvas');
    const modeInfo = document.getElementById('mode-info');

    /**
     * 切换渲染模式
     * @param {'dom-overlay'|'html-in-canvas'} mode - 目标模式
     */
    function setMode(mode) {
      currentMode = mode;

      if (mode === 'dom-overlay') {
        overlayLabels.forEach(({ elem }) => elem.style.display = '');
        htmlInCanvasLabels.forEach(({ plane }) => plane.visible = false);
        btnOverlay.classList.add('active');
        btnHtmlInCanvas.classList.remove('active');
        modeInfo.innerHTML = '当前: <strong>DOM-overlay</strong>（标签始终可见，无法被遮挡）';
      } else {
        overlayLabels.forEach(({ elem }) => elem.style.display = 'none');
        htmlInCanvasLabels.forEach(({ plane }) => plane.visible = true);
        btnOverlay.classList.remove('active');
        btnHtmlInCanvas.classList.add('active');
        modeInfo.innerHTML = '当前: <strong>HTML-in-Canvas</strong>（标签可被 3D 物体遮挡）';
      }
    }

    btnOverlay.addEventListener('click', () => setMode('dom-overlay'));
    btnHtmlInCanvas.addEventListener('click', () => setMode('html-in-canvas'));

    // ========================================
    // 6.5 交互控件事件（控制 3D 场景）
    // ========================================

    // 按钮：切换圆柱体颜色
    const cylinderColors = [0x6a3a8a, 0xaa4a4a, 0x4a8a6a, 0x4a6aaa];
    let colorIdx = 0;
    function toggleCylinderColor() {
      colorIdx = (colorIdx + 1) % cylinderColors.length;
      cylinder.material.color.setHex(cylinderColors[colorIdx]);
    }
    document.getElementById('ol-btn').addEventListener('click', toggleCylinderColor);
    document.getElementById('cl-btn').addEventListener('click', toggleCylinderColor);

    // 滑动条：控制方向光强度
    function updateLightIntensity(val) {
      dirLight.intensity = val / 100 * 2.4;
      document.getElementById('ol-range-val').textContent = val + '%';
      document.getElementById('cl-range-val').textContent = val + '%';
      // 修复：HTMLTexture 不会自动重绘，需手动标记纹理更新
      const sliderLabel = htmlInCanvasLabels.find(l => l.htmlElem?.id === 'cl-slider');
      if (sliderLabel && sliderLabel.texture) {
        sliderLabel.texture.needsUpdate = true;
      }
    }
    document.getElementById('ol-range').addEventListener('input', (e) => {
      updateLightIntensity(e.target.value);
      document.getElementById('cl-range').value = e.target.value;
    });
    document.getElementById('cl-range').addEventListener('input', (e) => {
      updateLightIntensity(e.target.value);
      document.getElementById('ol-range').value = e.target.value;
    });

    // 下拉框：切换十二面体材质模式
    function updateDodecaMode(value) {
      const mat = dodeca.material;
      if (value === 'wireframe') {
        mat.wireframe = true;
        mat.flatShading = false;
      } else if (value === 'flat') {
        mat.wireframe = false;
        mat.flatShading = true;
      } else {
        mat.wireframe = false;
        mat.flatShading = false;
      }
      mat.needsUpdate = true;
    }
    document.getElementById('ol-sel').addEventListener('change', (e) => {
      updateDodecaMode(e.target.value);
      document.getElementById('cl-sel').value = e.target.value;
    });
    document.getElementById('cl-sel').addEventListener('change', (e) => {
      updateDodecaMode(e.target.value);
      document.getElementById('ol-sel').value = e.target.value;
    });

    // ========================================
    // 7. Animation Loop（动画循环）
    // ========================================

    /**
     * 调整渲染器大小以匹配显示尺寸
     * @returns {boolean} 是否调整了大小
     */
    function resizeRendererToDisplaySize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const needResize = canvas.width !== width || canvas.height !== height;
      if (needResize) {
        renderer.setSize(width, height, false);
      }
      return needResize;
    }

    /**
     * 动画循环
     * @param {number} time - 时间戳（毫秒）
     */
    function animate(time) {
      requestAnimationFrame(animate);
      time *= 0.001;

      // 调整大小
      if (resizeRendererToDisplaySize()) {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
      }

      // 旋转物体
      cube.rotation.y = time * 0.5;
      cube.rotation.x = time * 0.3;
      sphere.rotation.y = time * 0.3;
      torus.rotation.y = time * 0.7;
      torus.rotation.x = time * 0.4;
      cylinder.rotation.y = time * 0.6;
      cone.rotation.y = time * 0.4;
      dodeca.rotation.y = time * 0.5;
      dodeca.rotation.x = time * 0.3;

      // 墙壁前后移动（演示遮挡效果的关键）
      wall.position.z = Math.sin(time * 0.4) * 3;

      // 更新标签
      if (currentMode === 'dom-overlay') {
        updateOverlayLabels(camera);
      } else {
        updateHtmlInCanvasLabels(camera);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate(0);
  </script>
</body>
</html>
