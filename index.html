<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f6f7;padding:16px}
.app{width:100%;max-width:400px}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:white;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat .num{font-size:28px;font-weight:700}
.stat .label{font-size:12px;color:#8f959e;margin-top:2px}
.stat.total .num{color:#1f2329}
.stat.mastered .num{color:#00b578}
.stat.learning .num{color:#1677FF}
.card{background:white;border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:12px}
.word{font-size:38px;font-weight:700;color:#1f2329;margin-bottom:4px}
.phonetic{font-size:15px;color:#8f959e;margin-bottom:4px}
.zh{font-size:18px;color:#646a73;margin-bottom:12px}
.status{display:inline-block;font-size:12px;padding:2px 10px;border-radius:10px;margin-bottom:12px}
.status.mastered{background:#e8f8f0;color:#00b578}
.status.learning{background:#e8f0ff;color:#1677FF}
.status.new{background:#fff3e0;color:#ff8f1f}
.speak-btn{display:inline-flex;align-items:center;gap:4px;background:#f0f5ff;color:#1677FF;border:none;border-radius:20px;padding:8px 18px;font-size:15px;cursor:pointer;margin-bottom:16px}
.speak-btn:active{background:#d6e4ff}
.accent-switch{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.accent-btn{padding:4px 12px;border-radius:12px;border:1px solid #d0d5dd;background:white;font-size:13px;color:#646a73;cursor:pointer}
.accent-btn.active{background:#1677FF;color:white;border-color:#1677FF}
.example-box{background:#fafafa;border-radius:12px;padding:14px 16px;margin-bottom:16px;text-align:left}
.example-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.example-en{font-size:14px;color:#1f2329;line-height:1.6;font-style:italic}
.example-zh{font-size:13px;color:#8f959e;margin-top:4px}
.example-label{font-size:11px;color:#c9cdd4;text-transform:uppercase;letter-spacing:.5px}
.ex-speak-btn{background:none;border:1px solid #e5e6eb;border-radius:12px;padding:3px 10px;font-size:12px;color:#646a73;cursor:pointer}
.ex-speak-btn:active{background:#f5f6f7}
.actions{display:flex;gap:10px;justify-content:center}
.btn{padding:10px 24px;border-radius:10px;font-size:15px;border:none;cursor:pointer}
.btn:active{opacity:.7}
.btn-master{background:#00b578;color:white}
.btn-review{background:#f5f6f7;color:#1f2329}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.nav-btn{background:white;border:none;padding:8px 16px;border-radius:8px;font-size:14px;color:#1677FF;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-btn:disabled{color:#d0d5dd;cursor:default}
.counter{font-size:13px;color:#8f959e}
.filter{display:flex;gap:8px;margin-bottom:12px}
.filter-btn{flex:1;padding:8px;border-radius:8px;border:none;font-size:14px;cursor:pointer;background:white;color:#646a73}
.filter-btn.active{background:#1677FF;color:white}
.empty{text-align:center;padding:60px 0;color:#8f959e;font-size:15px}
</style>
</head>
<body>
<div class="app">
  <div class="stats">
    <div class="stat total"><div class="num" id="totalCount">8</div><div class="label">总词汇</div></div>
    <div class="stat mastered"><div class="num" id="masteredCount">1</div><div class="label">已掌握</div></div>
    <div class="stat learning"><div class="num" id="learningCount">7</div><div class="label">学习中</div></div>
  </div>
  <div class="filter">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="learning">学习中</button>
    <button class="filter-btn" data-filter="mastered">已掌握</button>
  </div>
  <div id="cardArea"></div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn">上一个</button>
    <span class="counter" id="counter"></span>
    <button class="nav-btn" id="nextBtn">下一个</button>
  </div>
</div>

<script>
(function(){
  // ====== 数据 ======
  var words = [
    {en:"charger",zh:"充电器",phonetic:"/ˈtʃɑːrdʒər/",example:"My phone is dying \u2014 do you have a charger I can borrow?",exampleZh:"我手机快没电了\u2014\u2014你有充电器可以借我吗？",status:"learning",reviewed:2},
    {en:"cable",zh:"数据线",phonetic:"/ˈkeɪbl/",example:"I need a longer cable to reach the outlet.",exampleZh:"我需要一根更长的数据线才能够到插座。",status:"mastered",reviewed:5},
    {en:"plug",zh:"插头",phonetic:"/plʌɡ/",example:"Don\u2019t forget to pull the plug before you leave.",exampleZh:"走之前别忘了拔掉插头。",status:"learning",reviewed:1},
    {en:"adapter",zh:"适配器",phonetic:"/əˈdæptər/",example:"You\u2019ll need a travel adapter for your trip to the UK.",exampleZh:"你去英国旅行需要带一个转换适配器。",status:"learning",reviewed:0},
    {en:"extension cord",zh:"延长线",phonetic:"/ɪkˈstenʃn kɔːrd/",example:"Let\u2019s use an extension cord so we can work from the sofa.",exampleZh:"我们用根延长线吧，这样可以在沙发上办公。",status:"learning",reviewed:3},
    {en:"switch",zh:"开关",phonetic:"/swɪtʃ/",example:"Flip the switch on the wall to turn on the light.",exampleZh:"拨一下墙上的开关来开灯。",status:"new",reviewed:0},
    {en:"socket",zh:"插座",phonetic:"/ˈsɑːkɪt/",example:"There\u2019s an empty socket under the desk.",exampleZh:"桌子下面有个空插座。",status:"new",reviewed:0},
    {en:"microwave",zh:"微波炉",phonetic:"/ˈmaɪkrəweɪv/",example:"Just pop it in the microwave for two minutes.",exampleZh:"放进微波炉热两分钟就行。",status:"new",reviewed:0}
  ];

  var filtered = words.slice();
  var currentIdx = 0;

  // ====== DOM 构建 ======
  var area = document.getElementById("cardArea");
  var card = document.createElement("div"); card.className = "card";
  var wordEl = document.createElement("div"); wordEl.className = "word";
  var phoEl = document.createElement("div"); phoEl.className = "phonetic";
  var zhEl = document.createElement("div"); zhEl.className = "zh";
  var statusEl = document.createElement("div"); statusEl.className = "status";
  var speakBtn = document.createElement("button"); speakBtn.className = "speak-btn"; speakBtn.textContent = "\ud83d\udd0a 播放发音";
  var exBox = document.createElement("div"); exBox.className = "example-box";
  exBox.innerHTML = '<div class="example-header"><span class="example-label">生活例句</span><button class="ex-speak-btn" id="exSpeakBtn">🔊 播放例句</button></div><div class="example-en" id="exEn"></div><div class="example-zh" id="exZh"></div>';
  var actions = document.createElement("div"); actions.className = "actions";
  var btnMaster = document.createElement("button"); btnMaster.className = "btn btn-master"; btnMaster.textContent = "\u2705 已掌握";
  var btnReview = document.createElement("button"); btnReview.className = "btn btn-review"; btnReview.textContent = "\ud83d\udd04 再练";

  actions.appendChild(btnMaster);
  actions.appendChild(btnReview);
  card.appendChild(wordEl);
  card.appendChild(phoEl);
  card.appendChild(zhEl);
  card.appendChild(statusEl);
  card.appendChild(speakBtn);
  var accentSwitch = document.createElement("div"); accentSwitch.className = "accent-switch";
  var btnUS = document.createElement("button"); btnUS.className = "accent-btn active"; btnUS.textContent = "美式"; btnUS.dataset.type = "0";
  var btnUK = document.createElement("button"); btnUK.className = "accent-btn"; btnUK.textContent = "英式"; btnUK.dataset.type = "1";
  accentSwitch.appendChild(btnUS); accentSwitch.appendChild(btnUK);
  card.appendChild(accentSwitch);
  card.appendChild(exBox);
  card.appendChild(actions);
  area.innerHTML = "";
  area.appendChild(card);

  var exEn = document.getElementById("exEn");
  var exZh = document.getElementById("exZh");
  var counterEl = document.getElementById("counter");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var totalCount = document.getElementById("totalCount");
  var masteredCount = document.getElementById("masteredCount");
  var learningCount = document.getElementById("learningCount");

  // ====== 函数 ======
  function updateStats() {
    totalCount.textContent = words.length;
    masteredCount.textContent = words.filter(function(w){return w.status==="mastered"}).length;
    learningCount.textContent = words.filter(function(w){return w.status!=="mastered"}).length;
  }

  function render() {
    if (filtered.length === 0) {
      area.innerHTML = '<div class="empty">\u6ca1\u6709\u5355\u8bcd</div>';
      counterEl.textContent = "0 / 0";
      return;
    }
    var w = filtered[currentIdx];
    var labels = {mastered:"\u5df2\u638c\u63e1",learning:"\u5b66\u4e60\u4e2d",new:"\u65b0\u8bcd"};
    wordEl.textContent = w.en;
    phoEl.textContent = w.phonetic || "";
    zhEl.textContent = w.zh;
    statusEl.textContent = (labels[w.status] || "new") + " \u00b7 \u590d\u4e60 " + w.reviewed + " \u6b21";
    statusEl.className = "status " + w.status;
    exEn.textContent = w.example || "";
    exZh.textContent = w.exampleZh || "";
    counterEl.textContent = (currentIdx + 1) + " / " + filtered.length;
    prevBtn.disabled = currentIdx === 0;
    nextBtn.disabled = currentIdx === filtered.length - 1;
  }

  var accentType = "0"; // 0=美式, 1=英式

  function speak() {
    var w = filtered[currentIdx];
    var audioWord = w.en.toLowerCase().replace(/\s+/g, "");
    var url = "https://dict.youdao.com/dictvoice?type=" + accentType + "&audio=" + encodeURIComponent(audioWord);
    var a = new Audio(url);
    a.play().catch(function(){});
  }

  function speakExample() {
    var w = filtered[currentIdx];
    var text = w.example || w.en;
    // 优先 Google TTS（真人发音），失败回退 Web Speech API
    var url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=" + encodeURIComponent(text);
    var a = new Audio(url);
    a.onerror = function() {
      // Google 不可用，回退浏览器 TTS
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.85;
      speechSynthesis.speak(u);
    };
    a.play().catch(function(){});
  }

  function next() {
    if (currentIdx < filtered.length - 1) { currentIdx++; render(); speak(); }
  }

  function prev() {
    if (currentIdx > 0) { currentIdx--; render(); speak(); }
  }

  function mark(status) {
    var w = filtered[currentIdx];
    var orig = words.find(function(x){return x.en===w.en && x.zh===w.zh});
    if (orig) {
      orig.status = status;
      if (status === "learning") orig.reviewed++;
    }
    updateStats();
    var activeF = document.querySelector(".filter-btn.active");
    if (activeF) activeF = activeF.dataset.filter;
    else activeF = "all";
    applyFilter(activeF || "all");
    if (filtered.length > 0 && currentIdx >= filtered.length) currentIdx = filtered.length - 1;
    render();
  }

  function applyFilter(f) {
    if (f === "all") filtered = words.slice();
    else filtered = words.filter(function(w){return w.status===f});
    currentIdx = Math.min(currentIdx, filtered.length - 1);
    if (currentIdx < 0) currentIdx = 0;
    render();
    updateStats();
  }

  // ====== 事件绑定 ======
  speakBtn.addEventListener("click", speak);
  document.getElementById("exSpeakBtn").addEventListener("click", speakExample);
  btnMaster.addEventListener("click", function(){mark("mastered")});
  btnReview.addEventListener("click", function(){mark("learning")});
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  btnUS.addEventListener("click", function(){ accentType = "0"; btnUS.classList.add("active"); btnUK.classList.remove("active"); speak(); });
  btnUK.addEventListener("click", function(){ accentType = "1"; btnUK.classList.add("active"); btnUS.classList.remove("active"); speak(); });
  var fbs = document.querySelectorAll(".filter-btn");
  for (var i = 0; i < fbs.length; i++) {
    fbs[i].addEventListener("click", function(){
      for (var j = 0; j < fbs.length; j++) fbs[j].classList.remove("active");
      this.classList.add("active");
      applyFilter(this.dataset.filter);
    });
  }

  // ====== 启动 ======
  render();
  updateStats();
  speak();
})();
</script>
</body>
</html>
